apiVersion: batch/v1
kind: Job
metadata:
  name: lora-train
  namespace: openclaw
spec:
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
        - name: akurata-offsite-pull-bot
      restartPolicy: Never
      # restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: max
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Copy default configs from image to PVC if not already present.
      # User can override by pre-populating /data/config/ on the PVC.
      initContainers:
        - name: init-config
          image: us-east4-docker.pkg.dev/akurata-offsite/util/qwen-lora-trainer:2026.3.27-4
          command:
            - sh
            - -c
            - |
              set -euo pipefail

              # Pre-create the Triton cache dir so Triton can write kernel
              # autotune results. Triton silently skips caching if the
              # directory does not already exist.
              mkdir -p /data/cache/triton

              # Pull the training dataset
              echo "Downloading batch"
              curl -L \
                -H "X-Auth: $(curl -X POST -H "Content-Type: application/json" -d '{"username": "admin", "password": "admin"}' http://filebrowser.jellyfin.svc:8097/api/login)" \
                "http://filebrowser.jellyfin.svc:8097/api/raw/downloads/training/batch1.zip" \
                -o "/data/batch1.zip"
              unzip -n /data/batch1.zip -d /data/dataset/images
              rm /data/batch1.zip

              # Pull the regularization dataset
              hf download bghira/pseudo-camera-10k \
                --repo-type dataset \
                --local-dir /data/dataset/regularization/images

              # Pull the model weights
              hf download Qwen/Qwen-Image-2512 \
                --local-dir /data/models/Qwen-Image-2512
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: hf-token
          volumeMounts:
            - name: train-data
              mountPath: /data
              subPath: data
      containers:
        - name: train
          image: us-east4-docker.pkg.dev/akurata-offsite/util/qwen-lora-trainer:2026.3.27-4
          command: ["simpletuner", "train"]
          # SimpleTuner discovers config at ./config/config.json relative to workingDir
          workingDir: /data
          env:
            - name: TRAINING_NUM_PROCESSES
              value: "1"
            - name: TRAINING_NUM_MACHINES
              value: "1"
            - name: TRAINING_DYNAMO_BACKEND
              value: "no"
            - name: MIXED_PRECISION
              value: "bf16"
            - name: SIMPLETUNER_LOG_LEVEL
              value: "INFO"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            # Persist Triton kernel autotune cache on the PVC so the
            # hour-long first-run autotune on sm_100 Blackwell is not
            # repeated every time the pod restarts.
            - name: TRITON_CACHE_DIR
              value: "/data/cache/triton"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: train-data
              mountPath: /data
              subPath: data
            - name: shared-data
              mountPath: /shared
              subPath: data

            # Mount each config file individually so they land inside /data/config/
            # without conflicting with PVC content at /data.
            - name: lora-config
              mountPath: /data/config/config.json
              subPath: config.json
              readOnly: true
            - name: lora-config
              mountPath: /data/config/multidatabackend.json
              subPath: multidatabackend.json
              readOnly: true
            - name: lora-config
              mountPath: /data/config/config.env
              subPath: config.env
              readOnly: true
            - name: lora-config
              mountPath: /data/config/user_prompt_library.json
              subPath: user_prompt_library.json
              readOnly: true
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"

      volumes:
        - name: train-data
          persistentVolumeClaim:
            claimName: lora-training-cache
        - name: shared-data
          persistentVolumeClaim:
            claimName: comfyui-data
        - name: lora-config
          configMap:
            name: lora-training-config
