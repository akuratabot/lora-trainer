apiVersion: batch/v1
kind: Job
metadata:
  name: lora-train
  namespace: default
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: train
          image: YOUR_REGISTRY/qwen-lora-training:latest  # <-- replace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["simpletuner", "train"]
          # SimpleTuner discovers config at ./config/config.json relative to workingDir
          workingDir: /data
          env:
            - name: TRAINING_NUM_PROCESSES
              value: "1"
            - name: TRAINING_NUM_MACHINES
              value: "1"
            - name: TRAINING_DYNAMO_BACKEND
              value: "no"
            - name: MIXED_PRECISION
              value: "bf16"
            - name: SIMPLETUNER_LOG_LEVEL
              value: "INFO"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            # Uncomment if using HuggingFace Hub for model download:
            # - name: HF_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: hf-token
            #       key: token
          volumeMounts:
            - name: training-data
              mountPath: /data
            # Mount each config file individually so they land inside /data/config/
            # without conflicting with PVC content at /data.
            - name: lora-config
              mountPath: /data/config/config.json
              subPath: config.json
              readOnly: true
            - name: lora-config
              mountPath: /data/config/multidatabackend.json
              subPath: multidatabackend.json
              readOnly: true
            - name: lora-config
              mountPath: /data/config/config.env
              subPath: config.env
              readOnly: true
            - name: lora-config
              mountPath: /data/config/user_prompt_library.json
              subPath: user_prompt_library.json
              readOnly: true
          resources:
            requests:
              memory: "120Gi"
              nvidia.com/gpu: "1"
            limits:
              memory: "128Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: lora-training-pvc
        - name: lora-config
          configMap:
            name: lora-training-config
